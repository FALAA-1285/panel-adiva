# n8n dan WAHA khusus Bang Bana.
#
#   docker compose -f compose.bot.yml --env-file .env.bot up -d
#
# n8n (5678) dan WAHA (3001) yang sudah berjalan di VPS milik proyek lain, jadi
# Bang Bana mendapat sepasang miliknya sendiri di port 5679 dan 3002. Dipisah
# supaya credential Supabase, encryption key, riwayat eksekusi, sesi WhatsApp, dan
# versi keduanya tidak bercampur — dan supaya API key panel tidak bisa membaca
# workflow proyek lain lewat GET /workflows.
#
# Keduanya hanya terikat ke 127.0.0.1. n8n memegang credential database dan WAHA
# memegang sesi WhatsApp; tidak ada alasan membukanya ke internet. Buka UI-nya
# lewat SSH tunnel:
#   ssh -L 5679:127.0.0.1:5679 -L 3002:127.0.0.1:3002 root@158.220.117.56

services:
    n8n:
        image: docker.n8n.io/n8nio/n8n:latest
        container_name: bangbana-n8n
        restart: unless-stopped
        # VPS tidak punya swap: batas per container membuat lonjakan memori
        # membunuh container yang bersalah, bukan korban acak pilihan kernel
        mem_limit: 768m
        ports:
            - '127.0.0.1:5679:5678'
        environment:
            GENERIC_TIMEZONE: Asia/Jakarta
            TZ: Asia/Jakarta
            # dibuat sekali, jangan pernah diganti: kalau hilang, semua credential
            # di dalamnya tidak bisa didekripsi lagi
            N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?isi di .env.bot}
            WEBHOOK_URL: ${N8N_WEBHOOK_URL_PUBLIK:-http://127.0.0.1:5679/}
            N8N_PORT: 5678
            N8N_RUNNERS_ENABLED: 'true'
            N8N_DIAGNOSTICS_ENABLED: 'false'
            # chatbot menulis satu baris eksekusi per pesan; tanpa ini volumenya membengkak
            EXECUTIONS_DATA_PRUNE: 'true'
            EXECUTIONS_DATA_MAX_AGE: '336'
        volumes:
            - n8n:/home/node/.n8n
        extra_hosts:
            - 'host.docker.internal:host-gateway'

    waha:
        image: devlikeapro/waha:latest
        container_name: bangbana-waha
        restart: unless-stopped
        # paling lapar: engine WEBJS menjalankan satu Chromium per sesi WhatsApp,
        # dan Bang Bana memakai dua nomor
        mem_limit: 2g
        ports:
            - '127.0.0.1:3002:3000'
        environment:
            TZ: Asia/Jakarta
            WAHA_API_KEY: ${WAHA_API_KEY:?isi di .env.bot}
            WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-falah}
            WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?isi di .env.bot}
            WHATSAPP_DEFAULT_ENGINE: WEBJS
            # sesi dibangkitkan lagi sendiri setelah container restart
            WHATSAPP_RESTART_ALL_SESSIONS: 'true'
        volumes:
            # berisi sesi WhatsApp yang sudah dipindai QR — jangan sampai hilang,
            # kalau terhapus nomornya harus dipindai ulang
            - waha:/app/.waha
        extra_hosts:
            - 'host.docker.internal:host-gateway'

volumes:
    n8n:
    waha:
