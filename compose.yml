# Panel Adiva di VPS, berdampingan dengan n8n dan WAHA yang sudah jalan di sana.
#
#   docker compose up -d --build
#
# Tiga layanan dari satu image. Tanpa `worker`, pesan customer berhenti di tabel
# jobs dan Adiva tidak pernah menjawab; tanpa `cron`, pengingat jeda dan
# sinkronisasi n8n mati. Ketiganya wajib hidup.
#
# Database ada di Supabase, jadi di sini tidak ada container Postgres.

x-panel: &panel
    build: .
    image: panel-adiva:terbaru
    env_file: .env.produksi
    restart: unless-stopped
    # supaya panel bisa memanggil WAHA di :3001 dan n8n di :5678 lewat host,
    # tanpa perlu tahu nama jaringan Docker yang dipakai keduanya
    extra_hosts:
        - 'host.docker.internal:host-gateway'
    volumes:
        - berkas:/app/storage/app/public
        - log:/app/storage/logs

services:
    web:
        <<: *panel
        container_name: panel-web
        environment:
            # migrasi dijalankan dari satu layanan saja, supaya ketiganya tidak
            # bermigrasi bersamaan saat naik serentak
            JALANKAN_MIGRASI: '1'
        ports:
            - '8080:8080'
        healthcheck:
            test:
                [
                    'CMD',
                    'php',
                    '-r',
                    'exit(@file_get_contents("http://127.0.0.1:8080/up") ? 0 : 1);',
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s

    worker:
        <<: *panel
        container_name: panel-worker
        depends_on:
            web:
                condition: service_healthy
        # --max-time memulai ulang worker tiap jam: memori PHP yang bocor pelan
        # ikut bersih, dan kode baru terpakai tanpa perlu restart manual
        command: php artisan queue:work --tries=3 --backoff=10 --max-time=3600 --sleep=1

    cron:
        <<: *panel
        container_name: panel-cron
        depends_on:
            web:
                condition: service_healthy
        command: php artisan schedule:work

volumes:
    berkas:
    log:
