<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input type="search" aria-label="Cari" placeholder="Cari nama customer, nomor, atau ORD-…" style="border: none; outline: none; background: transparent; font-size: 13.5px; flex-grow: 1; min-width: 0; color: #111827; font-family: inherit">
<kbd style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #6B7280; border: 1px solid #E5E7EB; border-radius: 5px; padding: 1px 6px; background: #FFFFFF">⌘K</kbd>
</label>
<span style="flex-grow: 1"></span>
<span style="font-size: 12.5px; color: #6B7280; white-space: nowrap">Senin, 28 Sep · 13:42 WIB</span>
<span style="width: 1px; height: 20px; background: #E5E7EB"></span>
<a href="Notifikasi.dc.html" aria-label="Notifikasi: 4 belum dibaca" style="height: 34px; padding: 0 8px; border-radius: 8px; color: #374151; display: flex; align-items: center; gap: 6px; text-decoration: none; font-size: 13px; font-weight: 500">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg><span style="font-size: 11.5px; font-weight: 600; color: #FFFFFF; background: #2563EB; border-radius: 999px; padding: 1px 7px">4</span>
</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"w":{"editor":"int","default":1192,"min":600,"max":4000},"$preview":{"width":1192,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    return { wpx: Number(this.props.w || 1192) + 'px' };
  }
}
</script>
</body>
</html>
